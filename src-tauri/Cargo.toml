[package]
name = "caseforge"
version = "2.0.0-rc1"
description = "CaseForge — offline legal intelligence (Stage 2 Mock Court RC)"
authors = ["CaseForge"]
edition = "2021"

[lib]
name = "caseforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
# SQLCipher AES-256 (PRD §16). Vendored OpenSSL for Windows builds.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
# B-S4-29: compressed passage records in the on-disk legal store (pure Rust).
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# B-S4-16: X25519 key agreement for bundles. Already in the lock file as ed25519-dalek's dependency; no new download.
curve25519-dalek = "4"
# B-S1-19: economic at-rest protection for packs/models (not user vault data).
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
