# B-S4-27: builds the offline embedding model (multilingual-e5-small, MIT, pinned) as portable int8 and publishes it
# with a SHA-256 manifest to the models-v1 release. The installer build and pack embedding download it from there.
name: Embedding model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet onnxruntime==1.20.1 onnx==1.17.0 tokenizers==0.21.0 numpy==2.1.3
      - name: Download, quantise and check fidelity
        run: python eval/tools/make_embedding_model.py model-out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          gh release view models-v1 >/dev/null 2>&1 || gh release create models-v1 --prerelease --title "CaseForge offline models v1" --notes "multilingual-e5-small (MIT, intfloat, pinned commit) quantised to portable int8 for offline legal search. See model_manifest.json for source commit, SHA-256 and fidelity."
          gh release upload models-v1 model-out/model_int8.onnx model-out/tokenizer.json model-out/model_manifest.json --clobber
