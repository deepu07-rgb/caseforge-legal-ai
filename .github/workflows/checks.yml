# Fast checks: contract gates, Rust unit tests and every Stage 4 gate. No installer build.
# Runs on every push to main (and on demand), so nothing has to be compiled on the developer's machine.
# Linux runner (half the billed minutes of Windows); the Windows build and installer smoke tests stay in build-installer.yml.
name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/central-acts.yml"
      - ".github/workflows/sc-*.yml"
      - ".github/workflows/models.yml"
      - ".github/workflows/embed-packs.yml"
      - ".github/workflows/dense-eval.yml"
      - "packs/central/**"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Linux libraries for the Tauri crates
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev pkg-config build-essential

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit -p .

      - name: Contract gates (no model needed)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true # any failing gate fails the step, not only the last one
          python -m pip install --disable-pip-version-check --quiet jsonschema
          python eval/checks/contracts_b_s4_01.py
          python eval/checks/injection_guard_b_s4_00.py

      - name: Rust unit tests (+ Stage 4 gates from their log)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true # any failing gate fails the step, not only the last one
          $env:CASEFORGE_EVIDENCE_DIR = (New-Item -ItemType Directory -Force evidence).FullName
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eval/checks/answer_feedback_b_s4_00b.py --cargo-log cargo-test.log
          python eval/checks/citation_audit_b_s4_04.py --cargo-log cargo-test.log
          python eval/checks/certificate_b_s4_05.py --cargo-log cargo-test.log
          python eval/checks/opposing_scan_b_s4_06.py --cargo-log cargo-test.log --record evidence/opposing_scan_record.json
          python eval/checks/witness_matrix_b_s4_07.py --cargo-log cargo-test.log --matrix evidence/witness_matrix.json
          python eval/checks/impeachment_b_s4_08.py --cargo-log cargo-test.log --kits evidence/impeachment_kits.json
          python eval/checks/rule_tables_b_s4_03.py --cargo-log cargo-test.log
          python eval/checks/code_bridge_b_s4_09.py --cargo-log cargo-test.log --annotations evidence/code_bridge_annotations.json
          python eval/checks/reasoning_b_s4_28.py --cargo-log cargo-test.log
          python eval/checks/deadlines_b_s4_11.py --cargo-log cargo-test.log --records evidence/deadline_records.json
          python eval/checks/foundation_b_s4_10.py --cargo-log cargo-test.log --checks evidence/foundation_checks.json

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: |
            eval/reports/*.json
            cargo-test.log
            evidence/
          retention-days: 14
