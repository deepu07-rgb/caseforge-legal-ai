# B-S4-27: measures meaning-based retrieval on golden/G-DENSE with the shipped embedding model (release models-v1)
# against keyword search over the official criminal-codes pack. Fails if fusion ranks worse than keyword search.
name: Dense retrieval eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sidecars/docpipe/embed.py
      - eval/checks/dense_retrieval_b_s4_27.py
      - golden/G-DENSE/**
      - packs/official/caseforge.india.criminal-codes/**
      - .github/workflows/dense-eval.yml

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet onnxruntime==1.20.1 tokenizers==0.21.0 numpy==2.1.3
      - name: Offline embedding model
        run: |
          gh release download models-v1 -D models/e5-small --clobber
          echo "CASEFORGE_EMBED_MODEL=$PWD/models/e5-small" >> "$GITHUB_ENV"
      - name: G-DENSE
        run: |
          python eval/checks/dense_retrieval_b_s4_27.py --evidence evidence/dense_retrieval.json
          { echo '```json'; cat evidence/dense_retrieval.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
