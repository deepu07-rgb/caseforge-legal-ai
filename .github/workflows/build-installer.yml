# Builds the CaseForge Windows installer on GitHub's servers and proves the INSTALLED copy works.
#
# Run it:  Actions tab -> "Build Windows installer" -> Run workflow   (or push a tag like v2.0.0-rc2)
# Get it:  the run's "CaseForge-windows-installer" artifact, or the pre-release when publishing is enabled.
#
# The installer bundles: the app, the Python sidecars + a portable Python 3.12 (no system Python needed),
# the Tesseract OCR runtime, the contracts, and the signed India partition pack.
# NOT bundled (installed separately on the user's machine): Ollama and the local model (`ollama pull qwen2.5:7b`),
# and the optional speech stack. The installer is NOT code-signed yet, so Windows SmartScreen will warn.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish a GitHub pre-release with the installer"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to create the pre-release

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rust toolchain (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Contract gates (no model needed)
        run: |
          python -m pip install --disable-pip-version-check --quiet jsonschema
          python eval/checks/contracts_b_s4_01.py
          python eval/checks/injection_guard_b_s4_00.py

      - name: Rust unit tests (+ Stage 4 gates from their log)
        run: |
          $env:CASEFORGE_EVIDENCE_DIR = (New-Item -ItemType Directory -Force evidence).FullName
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eval/checks/answer_feedback_b_s4_00b.py --cargo-log cargo-test.log
          python eval/checks/citation_audit_b_s4_04.py --cargo-log cargo-test.log
          python eval/checks/certificate_b_s4_05.py --cargo-log cargo-test.log
          python eval/checks/opposing_scan_b_s4_06.py --cargo-log cargo-test.log --record evidence/opposing_scan_record.json
          python eval/checks/witness_matrix_b_s4_07.py --cargo-log cargo-test.log --matrix evidence/witness_matrix.json
          python eval/checks/impeachment_b_s4_08.py --cargo-log cargo-test.log --kits evidence/impeachment_kits.json

      - name: Stage bundled portable Python
        run: ./scripts/stage_runtime_python.ps1

      - name: Smoke-test the staged layout with the bundled Python only
        run: ./scripts/smoke_installed_layout.ps1 -Root .

      - name: Build installer (NSIS)
        run: npm run tauri:build -- --bundles nsis

      - name: Locate installer
        id: installer
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not produced' }
          "path=$($setup.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "name=$($setup.Name)"     | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Install silently and smoke-test the INSTALLED copy
        run: |
          Start-Process -FilePath '${{ steps.installer.outputs.path }}' -ArgumentList '/S' -Wait
          $roots = @("$env:LOCALAPPDATA\CaseForge", "$env:LOCALAPPDATA\Programs\CaseForge", "$env:ProgramFiles\CaseForge")
          $exe = Get-ChildItem -Path $roots -Filter '*.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found under: $($roots -join ', ')" }
          "Installed to $($exe.DirectoryName)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          ./scripts/smoke_installed_layout.ps1 -Root (Join-Path $exe.DirectoryName '_up_')
          "INSTALLED_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CaseForge-windows-installer
          path: ${{ steps.installer.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Launch probe (installed app stays up for 20 s)
        continue-on-error: true # a headless runner may lack a desktop session; reported, not blocking
        run: |
          $p = Start-Process -FilePath $env:INSTALLED_EXE -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "Launch probe: app stayed up for 20 s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'installer-build-${{ github.run_number }}' }
          $notes = "Windows test installer built from ${{ github.sha }}.`n`nNot code-signed: Windows SmartScreen will warn (More info -> Run anyway).`nAfter installing: install Ollama and run ``ollama pull qwen2.5:7b`` for the local AI features."
          gh release create $tag '${{ steps.installer.outputs.path }}' --prerelease --title "CaseForge test build $tag" --notes $notes --target '${{ github.sha }}'
