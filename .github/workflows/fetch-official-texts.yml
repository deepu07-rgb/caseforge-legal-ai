# Acquires the official India Code PDFs of the six criminal-law Acts (IPC, CrPC, Evidence Act and their 2023
# successors) for the criminal-codes pack. Run on demand; the PDFs and their SHA-256 ledger are uploaded as an
# artifact. Nothing is committed: the pack builder records each PDF's URL and checksum.
name: Fetch official texts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch from India Code (retries while the site returns 5xx)
        run: python -I eval/tools/fetch_indiacode.py official-texts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-texts
          path: official-texts/
          retention-days: 7
